# docker compose up --build      -> http://localhost:8000
# docker compose run --rm web python -m app.seed      (load the real data from data/seed - see README "Real data")
# docker compose run --rm web python -m app.importer excel/MM_Promo_Tool.xlsx --reset   (load only the sample workbook data)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: promo
      POSTGRES_DB: promo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d promo"], interval: 3s, retries: 20}
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:promo@db:5432/promo
    volumes:
      - ./data:/srv/data:ro
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
volumes:
  pgdata:
